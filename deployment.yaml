apiVersion: apps/v1
kind: Deployment
metadata:
  name: frost-app
  labels:
    app: frost-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frost-app
  template:
    metadata:
      labels:
        app: frost-app
    spec:
      serviceAccountName: default
      containers:
      - name: frost-app
        image: 566074325882.dkr.ecr.us-east-1.amazonaws.com/devops:1ed82e3465308481eddc38a90c70085264abc431
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always